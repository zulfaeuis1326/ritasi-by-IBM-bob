services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ritasi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ritasi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritasi"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ritasi:${DB_PASSWORD}@db:5432/ritasi
      AUTH_SECRET: ${AUTH_SECRET}
    ports:
      - "3000:3000"

volumes:
  pgdata: